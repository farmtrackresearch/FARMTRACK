; ===========================================================================
;  FarmTrack - one environment per component test.
;  Only ONE test .cpp is compiled per environment (build_src_filter), so each
;  can have its own setup()/loop() without colliding.
;
;  Run a test:
;     pio run -e esp32     -t upload -t monitor     # board sanity (serial + chip info)
;     pio run -e gps       -t upload -t monitor     # NEO-6M GPS
;     pio run -e lora_tx   -t upload -t monitor     # SX1278 sender   (real link profile)
;     pio run -e lora_rx   -t upload -t monitor     # SX1278 receiver (real link profile)
;     pio run -e gps_baud  -t upload -t monitor     # diagnostic: GPS baud scan
;     pio run -e gps_power -t upload -t monitor     # diagnostic: GPS under reduced load
;     pio run -e collar    -t upload -t monitor     # real collar: GPS + LoRa uplink + buzzer
;     pio run -e gateway   -t upload -t monitor     # real gateway: LoRa + WiFi -> Supabase
;
;  In VS Code: pick the environment in the PlatformIO status bar, then use the
;  Build / Upload / Monitor buttons.
;
;  Versions are pinned exactly. With "^" ranges a fresh clone could build
;  against a newer core or library than the one this firmware was tested with
;  - the TLS and watchdog code depends on arduino-esp32 2.0.17 behaviour
;  (espressif32 7.1.0), and the protocol on LoRa 0.8.0's register handling.
; ===========================================================================

[platformio]
default_envs = esp32

[env]
platform = espressif32 @ 7.1.0
board = esp32doit-devkit-v1
framework = arduino
monitor_speed = 115200
; CH340 on macOS is unreliable above 115200 for flashing.
upload_speed = 115200

[env:esp32]
build_src_filter = -<*> +<test_esp32.cpp>

[env:gps]
build_src_filter = -<*> +<test_gps.cpp>
lib_deps =
    mikalhart/TinyGPSPlus @ 1.1.0
    sandeepmistry/LoRa @ 0.8.0

[env:lora_tx]
build_src_filter = -<*> +<test_lora_tx.cpp>
lib_deps = sandeepmistry/LoRa @ 0.8.0

[env:lora_rx]
build_src_filter = -<*> +<test_lora_rx.cpp>
lib_deps = sandeepmistry/LoRa @ 0.8.0

[env:collar]
build_src_filter = -<*> +<collar.cpp>
lib_deps =
    mikalhart/TinyGPSPlus @ 1.1.0
    sandeepmistry/LoRa @ 0.8.0

[env:gateway]
build_src_filter = -<*> +<gateway.cpp>
lib_deps =
    sandeepmistry/LoRa @ 0.8.0
    bblanchon/ArduinoJson @ 7.4.3

; Diagnostic: find what baud / protocol the GPS module is actually using.
; No lib_deps - it reads raw bytes rather than parsing NMEA.
[env:gps_baud]
build_src_filter = -<*> +<test_gps_baud.cpp>

; Diagnostic: the radio starts but never finishes a send. Prints the SX1278's
; mode and TxDone flag while it sends at 17 dBm and at 2 dBm, to tell a
; supply brownout from a wiring or module fault.
[env:lora_diag]
build_src_filter = -<*> +<test_lora_diag.cpp>
lib_deps = sandeepmistry/LoRa @ 0.8.0

; Diagnostic: the radio sends but never hears. Listens continuously and
; reports good packets, corrupted packets, and the strongest signal sensed.
[env:lora_listen]
build_src_filter = -<*> +<test_lora_listen.cpp>
lib_deps = sandeepmistry/LoRa @ 0.8.0

; Diagnostic: is the GPS brownout a power-budget problem? Sheds the radio,
; clocks down the CPU and kills WiFi/BT in software - no rewiring needed.
[env:gps_power]
build_src_filter = -<*> +<test_gps_power.cpp>
lib_deps = sandeepmistry/LoRa @ 0.8.0
