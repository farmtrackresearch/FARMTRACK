; ===========================================================================
;  FarmTrack - one environment per component test.
;  Only ONE test .cpp is compiled per environment (build_src_filter), so each
;  can have its own setup()/loop() without colliding.
;
;  Run a test:
;     pio run -e esp32    -t upload -t monitor      # board sanity (LED + serial)
;     pio run -e gps      -t upload -t monitor      # NEO-6M GPS
;     pio run -e lora_tx  -t upload -t monitor      # SX1278 sender
;     pio run -e lora_rx  -t upload -t monitor      # SX1278 receiver
;     pio run -e collar   -t upload -t monitor      # real collar: GPS + LoRa uplink + buzzer
;     pio run -e gateway  -t upload -t monitor      # real gateway: LoRa + WiFi -> Supabase
;
;  In VS Code: pick the environment in the PlatformIO status bar, then use the
;  Build / Upload / Monitor buttons.
; ===========================================================================

[platformio]
default_envs = esp32

[env]
platform = espressif32
board = esp32doit-devkit-v1
framework = arduino
monitor_speed = 115200
; CH340 on macOS is unreliable above 115200 for flashing.
upload_speed = 115200

[env:esp32]
build_src_filter = -<*> +<test_esp32.cpp>

[env:gps]
build_src_filter = -<*> +<test_gps.cpp>
lib_deps = mikalhart/TinyGPSPlus@^1.1.0

[env:lora_tx]
build_src_filter = -<*> +<test_lora_tx.cpp>
lib_deps = sandeepmistry/LoRa@^0.8.0

[env:lora_rx]
build_src_filter = -<*> +<test_lora_rx.cpp>
lib_deps = sandeepmistry/LoRa@^0.8.0

[env:collar]
build_src_filter = -<*> +<collar.cpp>
lib_deps =
    mikalhart/TinyGPSPlus@^1.1.0
    sandeepmistry/LoRa@^0.8.0

[env:gateway]
build_src_filter = -<*> +<gateway.cpp>
lib_deps =
    sandeepmistry/LoRa@^0.8.0
    bblanchon/ArduinoJson@^7.1.0
